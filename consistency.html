<script>
        const months = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        const CORRECT_PASSWORD = "251425";
        let isLoggedIn = false;

        const today = new Date();
        
        // 1. Ambil data tersimpan dari LocalStorage saat halaman pertama kali dimuat
        const savedDates = JSON.parse(localStorage.getItem('calendar_selected_dates') || '[]');
        const selectedDates = new Set(savedDates);

        let loadedStartYear, loadedStartMonth;
        let loadedEndYear, loadedEndMonth;

        const calendarWrapper = document.getElementById('calendar-wrapper');
        const calendarContainer = document.getElementById('calendar-scroll-container');
        const headerTitle = document.getElementById('current-focused-header');
        const btnToday = document.getElementById('btn-today');
        const btnReset = document.getElementById('btn-reset');
        
        const btnLoginTrigger = document.getElementById('btn-login-trigger');
        const btnLoginText = document.getElementById('btn-login-text');
        const loginModal = document.getElementById('login-modal');
        const modalCard = document.getElementById('modal-card');
        const passwordInput = document.getElementById('password-input');
        const errorMessage = document.getElementById('error-message');

        // Fungsi Helper untuk Menyimpan State ke LocalStorage
        function saveToLocalStorage() {
            localStorage.setItem('calendar_selected_dates', JSON.stringify(Array.from(selectedDates)));
        }

        function formatDateKey(year, month, day) {
            const m = String(month + 1).padStart(2, '0');
            const d = String(day).padStart(2, '0');
            return `${year}-${m}-${d}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function createMonthView(year, month) {
            const monthDiv = document.createElement('div');
            monthDiv.className = 'month-block mb-6';
            monthDiv.dataset.year = year;
            monthDiv.dataset.month = month;

            const monthHeader = document.createElement('div');
            monthHeader.className = 'month-header-sticky py-2 px-3 mb-2 text-sm font-bold text-slate-200 border-b border-slate-700/40 rounded-lg flex justify-between items-center';
            monthHeader.innerHTML = `
                <span>${months[month]} ${year}</span>
                <span class="text-[10px] font-normal text-slate-500">${year}</span>
            `;
            monthDiv.appendChild(monthHeader);

            const daysGrid = document.createElement('div');
            daysGrid.className = 'grid grid-cols-7 gap-y-1 text-center text-xs';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-10';
                daysGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell h-10 flex items-center justify-center';
                
                const dateKey = formatDateKey(year, month, day);
                dayCell.dataset.date = dateKey;

                const isToday = (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                );

                if (isToday) dayCell.classList.add('is-today');
                
                if (selectedDates.has(dateKey)) {
                    dayCell.classList.add('selected');
                }

                const numberSpan = document.createElement('span');
                numberSpan.className = 'day-number';
                numberSpan.innerText = day;

                dayCell.appendChild(numberSpan);

                dayCell.addEventListener('click', () => handleDateClick(dateKey, dayCell));

                daysGrid.appendChild(dayCell);
            }

            monthDiv.appendChild(daysGrid);
            return monthDiv;
        }

        function handleDateClick(dateKey, cellElement) {
            if (!isLoggedIn) {
                return; // Silent click sebelum login
            }

            if (selectedDates.has(dateKey)) {
                selectedDates.delete(dateKey);
                cellElement.classList.remove('selected');
            } else {
                selectedDates.add(dateKey);
                cellElement.classList.add('selected');
            }

            // 2. Simpan ke LocalStorage tiap ada perubahan klik tanggal
            saveToLocalStorage();
        }

        function openLoginModal() {
            loginModal.classList.remove('hidden');
            passwordInput.value = '';
            errorMessage.innerText = '';
            errorMessage.classList.add('hidden');
            setTimeout(() => passwordInput.focus(), 150);
        }

        function closeLoginModal() {
            loginModal.classList.add('hidden');
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const inputVal = passwordInput.value.trim();

            if (inputVal === CORRECT_PASSWORD) {
                isLoggedIn = true;
                closeLoginModal();
                updateSystemLockState();
                showToast("Login berhasil! Akses kalender aktif.");
            } else {
                errorMessage.innerText = "Password salah! Silakan coba lagi.";
                errorMessage.classList.remove('hidden');
                modalCard.classList.add('animate-shake');
                setTimeout(() => modalCard.classList.remove('animate-shake'), 400);
            }
        }

        function updateSystemLockState() {
            if (isLoggedIn) {
                calendarWrapper.classList.remove('is-locked');
                btnLoginText.innerText = "Logout";
                btnLoginTrigger.className = "px-3.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold rounded-lg shadow-lg shadow-rose-600/30 border border-rose-400/40 transition flex items-center gap-1.5";
                btnLoginTrigger.querySelector('i').className = "fa-solid fa-right-from-bracket";
            } else {
                calendarWrapper.classList.add('is-locked');
                btnLoginText.innerText = "Login";
                btnLoginTrigger.className = "px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-lg shadow-emerald-600/30 border border-emerald-400/40 transition flex items-center gap-1.5";
                btnLoginTrigger.querySelector('i').className = "fa-solid fa-right-to-bracket";
            }
        }

        btnLoginTrigger.addEventListener('click', () => {
            if (isLoggedIn) {
                isLoggedIn = false;
                updateSystemLockState();
                showToast("Anda telah logout. Kalender kembali terkunci.");
            } else {
                openLoginModal();
            }
        });

        function initCalendar() {
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();

            loadedStartYear = currentYear;
            loadedStartMonth = currentMonth - 3;
            if (loadedStartMonth < 0) {
                loadedStartMonth += 12;
                loadedStartYear--;
            }

            loadedEndYear = currentYear;
            loadedEndMonth = currentMonth + 5;
            if (loadedEndMonth > 11) {
                loadedEndMonth -= 12;
                loadedEndYear++;
            }

            let tempY = loadedStartYear;
            let tempM = loadedStartMonth;

            while (tempY < loadedEndYear || (tempY === loadedEndYear && tempM <= loadedEndMonth)) {
                calendarContainer.appendChild(createMonthView(tempY, tempM));
                tempM++;
                if (tempM > 11) {
                    tempM = 0;
                    tempY++;
                }
            }

            updateSystemLockState();

            setTimeout(() => {
                scrollToToday(true);
                updateStickyHeaderTitle();
            }, 80);
        }

        function prependMonth() {
            loadedStartMonth--;
            if (loadedStartMonth < 0) {
                loadedStartMonth = 11;
                loadedStartYear--;
            }
            const oldScrollHeight = calendarContainer.scrollHeight;
            const newMonthEl = createMonthView(loadedStartYear, loadedStartMonth);
            calendarContainer.insertBefore(newMonthEl, calendarContainer.firstChild);
            calendarContainer.scrollTop += (calendarContainer.scrollHeight - oldScrollHeight);
        }

        function appendMonth() {
            loadedEndMonth++;
            if (loadedEndMonth > 11) {
                loadedEndMonth = 0;
                loadedEndYear++;
            }
            const newMonthEl = createMonthView(loadedEndYear, loadedEndMonth);
            calendarContainer.appendChild(newMonthEl);
        }

        calendarContainer.addEventListener('scroll', () => {
            if (calendarContainer.scrollTop < 120) prependMonth();
            if (calendarContainer.scrollHeight - calendarContainer.scrollTop - calendarContainer.clientHeight < 120) appendMonth();
            updateStickyHeaderTitle();
        });

        function updateStickyHeaderTitle() {
            const monthBlocks = calendarContainer.querySelectorAll('.month-block');
            const containerTop = calendarContainer.getBoundingClientRect().top;

            monthBlocks.forEach(block => {
                const rect = block.getBoundingClientRect();
                if (rect.top - containerTop <= 80 && rect.bottom - containerTop > 40) {
                    const y = block.dataset.year;
                    const m = parseInt(block.dataset.month);
                    headerTitle.querySelector('span').innerText = `${months[m]} ${y}`;
                }
            });
        }

        function scrollToToday(smooth = true) {
            const todayEl = calendarContainer.querySelector('.day-cell.is-today');
            if (todayEl) {
                todayEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
            }
        }

        btnToday.addEventListener('click', () => scrollToToday(true));

        btnReset.addEventListener('click', () => {
            if (!isLoggedIn) return;
            if (selectedDates.size === 0) return;
            
            selectedDates.clear();
            
            // 3. Update LocalStorage saat tombol reset ditekan
            saveToLocalStorage();

            const allSelected = calendarContainer.querySelectorAll('.day-cell.selected');
            allSelected.forEach(el => el.classList.remove('selected'));
        });

        window.onload = function() {
            initCalendar();
        };
    </script>
