<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Cloud Sync (Google Sheets)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
    }
    .no-scrollbar::-webkit-scrollbar { width: 4px; }
    .no-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

    .day-cell { position: relative; user-select: none; }
    .day-number {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: all 0.2s ease;
      font-size: 0.875rem;
    }
    .day-cell.selected .day-number {
      background-color: #22c55e;
      color: #ffffff !important;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    }
    .day-cell.is-today .day-number {
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-weight: 700;
    }
    .day-cell.is-today::after {
      content: '';
      position: absolute; bottom: 2px; left: 50%;
      transform: translateX(-50%);
      width: 5px; height: 5px;
      background-color: #38bdf8;
      border-radius: 50%;
    }
    .day-cell.is-today.selected .day-number {
      border: 2px solid #ffffff;
      background-color: #22c55e;
      color: #ffffff !important;
    }
    .month-header-sticky {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 min-h-screen">

  <div class="w-full max-w-2xl flex flex-col h-[90vh] max-h-[800px] gap-4">
    
    <!-- Kalender Box -->
    <div class="w-full bg-slate-900/80 backdrop-blur-xl rounded-2xl flex flex-col overflow-hidden shadow-2xl border border-slate-700/50 flex-1">
      
      <!-- Top Bar -->
      <div class="p-4 border-b border-slate-700/60 flex items-center justify-between bg-slate-800/40">
        <div>
          <h1 id="header-title" class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-regular fa-calendar-check text-green-400"></i>
            <span>Kalender Saya</span>
          </h1>
          <p id="sync-status" class="text-[11px] text-slate-400 mt-0.5">Mengkoneksikan Cloud...</p>
        </div>
        
        <div class="flex items-center gap-2">
          <button id="btn-today" class="px-3 py-1.5 bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 text-xs font-semibold rounded-lg border border-sky-500/30 transition">
            Hari Ini
          </button>
          <button id="btn-reset" class="px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-semibold rounded-lg border border-rose-500/30 transition">
            Reset
          </button>
          <button id="btn-login-trigger" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-lg border border-emerald-400/40 transition">
            <span id="btn-login-text">Login</span>
          </button>
        </div>
      </div>

      <!-- Nama Hari Header -->
      <div class="grid grid-cols-7 bg-slate-950 text-center py-2 text-xs font-semibold text-slate-400 border-b border-slate-800">
        <span class="text-rose-400">Ming</span>
        <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span>
        <span class="text-sky-400">Sab</span>
      </div>

      <!-- Wadah Scroll Kalender -->
      <div id="calendar-scroll-container" class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-6"></div>
    </div>

    <!-- Quote Box Footer -->
    <div class="bg-slate-900/80 backdrop-blur-xl rounded-2xl p-4 text-center border border-slate-700/50 shadow-xl flex items-center justify-center gap-3">
      <i class="fa-solid fa-quote-left text-emerald-400/50 text-xl"></i>
      <p class="text-base sm:text-lg font-semibold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-sky-400 italic">
        "Consistency is my identity."
      </p>
      <i class="fa-solid fa-quote-right text-emerald-400/50 text-xl"></i>
    </div>

  </div>

  <!-- Modal Login -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
      <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="text-center mb-5">
        <h3 class="text-base font-bold text-white">Login Akun</h3>
        <p class="text-xs text-slate-400 mt-1">Masukkan password untuk mengedit kalender.</p>
      </div>

      <form onsubmit="handleLoginSubmit(event)">
        <div class="relative flex items-center mb-2">
          <input type="password" id="password-input" placeholder="Password" maxlength="20"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 pr-12 text-sm text-white focus:outline-none focus:border-emerald-500">
          <button type="submit" class="absolute right-1.5 w-8 h-8 bg-emerald-600 text-white rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
        <p id="error-message" class="text-xs text-rose-400 min-h-[18px] hidden"></p>
      </form>
    </div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHQ2EOdVKSyCDsBgJPLgNIl4K24CdsMG3DvjKwrLPW0d6ddthjWQ95q6oXF08sE1kQyQ/exec";

    const CORRECT_PASSWORD = "252525";
    let isLoggedIn = false;
    const today = new Date();
    let selectedDates = new Set();

    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const container = document.getElementById('calendar-scroll-container');
    const syncStatus = document.getElementById('sync-status');

    // Load Data dari Google Sheets
    async function loadCloudData() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("TEMPEL_URL")) {
        syncStatus.innerText = "URL Google Script belum diisi!";
        renderCalendar();
        return;
      }

      try {
        syncStatus.innerText = "Memuat data Cloud (Google Sheets)...";
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data && data.dates) {
          selectedDates = new Set(data.dates);
        }
        syncStatus.innerHTML = '<a href="https://munirabdul.github.io" target="_blank" rel="noopener noreferrer">← Home</a>';
      } catch (e) {
        syncStatus.innerText = "Gagal Sync Cloud (Periksa URL Script)";
      }
      renderCalendar();
    }

    // Save Data ke Google Sheets
    async function saveCloudData() {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("TEMPEL_URL")) return;

      const datesArray = Array.from(selectedDates);
      try {
        syncStatus.innerText = "Menyimpan ke Cloud...";
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Menghindari isu CORS Browser
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dates: datesArray })
        });
        syncStatus.innerText = "Tersimpan di Cloud";
      } catch (e) {
        syncStatus.innerText = "Gagal Menyimpan";
      }
    }

    function formatDateKey(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function renderCalendar() {
      container.innerHTML = '';
      const currentYear = today.getFullYear();
      
      for (let y = currentYear - 1; y <= currentYear + 1; y++) {
        for (let m = 0; m < 12; m++) {
          const monthDiv = document.createElement('div');
          monthDiv.className = 'month-block mb-6';
          
          const monthHeader = document.createElement('div');
          monthHeader.className = 'month-header-sticky py-2 px-3 mb-2 text-sm font-bold text-slate-200 border-b border-slate-800 rounded-lg flex justify-between';
          monthHeader.innerHTML = `<span>${months[m]} ${y}</span><span class="text-xs text-slate-500">${y}</span>`;
          monthDiv.appendChild(monthHeader);

          const daysGrid = document.createElement('div');
          daysGrid.className = 'grid grid-cols-7 gap-y-1 text-center text-xs';

          const firstDay = new Date(y, m, 1).getDay();
          const totalDays = new Date(y, m + 1, 0).getDate();

          for (let i = 0; i < firstDay; i++) {
            daysGrid.appendChild(document.createElement('div'));
          }

          for (let d = 1; d <= totalDays; d++) {
            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell h-10 flex items-center justify-center cursor-pointer';
            
            const dateKey = formatDateKey(y, m, d);
            
            if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) {
              dayCell.classList.add('is-today');
              dayCell.id = 'today-target';
            }

            if (selectedDates.has(dateKey)) {
              dayCell.classList.add('selected');
            }

            const numSpan = document.createElement('span');
            numSpan.className = 'day-number';
            numSpan.innerText = d;
            dayCell.appendChild(numSpan);

            dayCell.addEventListener('click', () => {
              if (!isLoggedIn) return;
              if (selectedDates.has(dateKey)) {
                selectedDates.delete(dateKey);
                dayCell.classList.remove('selected');
              } else {
                selectedDates.add(dateKey);
                dayCell.classList.add('selected');
              }
              saveCloudData();
            });

            daysGrid.appendChild(dayCell);
          }
          monthDiv.appendChild(daysGrid);
          container.appendChild(monthDiv);
        }
      }

      setTimeout(() => {
        const todayEl = document.getElementById('today-target');
        if (todayEl) {
          todayEl.scrollIntoView({ behavior: 'instant', block: 'center' });
        }
      }, 50);
    }

    function openLoginModal() {
      document.getElementById('login-modal').classList.remove('hidden');
      document.getElementById('password-input').value = '';
      document.getElementById('password-input').focus();
    }
    function closeLoginModal() {
      document.getElementById('login-modal').classList.add('hidden');
    }
    function handleLoginSubmit(e) {
      e.preventDefault();
      const val = document.getElementById('password-input').value;
      if (val === CORRECT_PASSWORD) {
        isLoggedIn = true;
        closeLoginModal();
        document.getElementById('btn-login-text').innerText = "Logout";
        document.getElementById('btn-login-trigger').className = "px-3.5 py-1.5 bg-rose-600 text-white text-xs font-semibold rounded-lg shadow-lg border border-rose-400/40 transition";
      } else {
        const err = document.getElementById('error-message');
        err.innerText = "Password Salah!";
        err.classList.remove('hidden');
      }
    }

    document.getElementById('btn-login-trigger').addEventListener('click', () => {
      if (isLoggedIn) {
        isLoggedIn = false;
        document.getElementById('btn-login-text').innerText = "Login";
        document.getElementById('btn-login-trigger').className = "px-3.5 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded-lg shadow-lg border border-emerald-400/40 transition";
      } else {
        openLoginModal();
      }
    });

    document.getElementById('btn-today').addEventListener('click', () => {
      const todayEl = document.getElementById('today-target');
      if (todayEl) todayEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!isLoggedIn) return;
      selectedDates.clear();
      saveCloudData();
      renderCalendar();
    });

    window.onload = loadCloudData;
  </script>
</body>
</html>
